sections:
  - title: "📌 Global info"
    description: >
      High-level overview: what the subject is, its origin, context,
      and where it sits in the ecosystem.

  - title: "⚙️ Fonctionnement"
    description: >
      How it works technically: architecture, core concepts, data flow,
      main components, and internals worth knowing.

  - title: "📈 PROS"
    description: >
      Concrete advantages, strengths, and unique selling points —
      backed by evidence, not marketing copy.

  - title: "⚠️ Cons / Limitations"
    description: >
      Known drawbacks, constraints, failure modes, maturity concerns,
      and anything that could make you regret using it.

  - title: "🧪 Examples"
    description: >
      Practical use cases, code snippets, real-world deployments, or demos
      that show the subject in action.

  - title: "📊 Comparaison"
    description: >
      Side-by-side comparison with competing or related tools/approaches —
      when to pick this over the alternatives.

  - title: "🔍 Links"
    description: >
      Curated references: official docs, key papers, benchmarks, notable
      blog posts, community resources.

  - title: "📝 Conclusion et recommandations"
    description: >
      Bottom line: when to use it, when to avoid it, and concrete
      next steps for someone doing tech-watch.
