[project]
name = "techno-watch-bot"
version = "2.0.0"
description = "TUI that drives Claude Code to research Google Tasks and write tech-watch notes"
requires-python = ">=3.11"
dependencies = [
  "claude-agent-sdk>=0.1.0",
  "httpx>=0.28.1",
  "pydantic>=2.0",
  "python-slugify>=8.0",
  "rich>=13.0",
  "textual>=0.80",
  "tomli-w>=1.0",
  "typer>=0.12",
]

[project.scripts]
techno-watch-bot = "techno_watch_bot.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["techno_watch_bot*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
