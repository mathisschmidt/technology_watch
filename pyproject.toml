[project]
name = "veille-tech"
version = "0.1.0"
description = "TUI that turns Google Tasks into researched Obsidian notes"
requires-python = ">=3.10"
dependencies = [
  "anthropic>=0.39",
  "google-api-python-client>=2.130",
  "google-auth-httplib2>=0.2",
  "google-auth-oauthlib>=1.2",
  "python-slugify>=8.0",
  "pydantic>=2.0",
  "pyyaml>=6.0",
  "typer>=0.25.1",
  "rich>=15.0.0",
]

[project.scripts]
veille-tech = "veille_tech.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["veille_tech*"]
