name: Release

# Push a tag like `v2.0.0` to build the executables and publish a GitHub Release.
# "Run workflow" in the Actions tab builds them without releasing (files are
# downloadable from the run's Artifacts section).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.13
      - run: uv sync --locked --group build
      - run: uv run --group build python scripts/build.py
      - name: Check the executable starts
        shell: bash
        run: |
          bin=$(ls dist/techno-watch-bot-*)
          echo "Built $bin"
          "$bin" --help
      - uses: actions/upload-artifact@v4
        with:
          name: techno-watch-bot-${{ matrix.os }}
          path: dist/techno-watch-bot-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Download

            Pick the file for your system below, then run it from a terminal:

            | System | File |
            |---|---|
            | Linux (x86_64) | `techno-watch-bot-linux-x86_64` |
            | macOS (Apple Silicon) | `techno-watch-bot-macos-arm64` |
            | Windows (x86_64) | `techno-watch-bot-windows-x86_64.exe` |

            - **Linux:** `chmod +x techno-watch-bot-linux-x86_64` then `./techno-watch-bot-linux-x86_64`
            - **macOS:** `chmod +x techno-watch-bot-macos-arm64`, then
              `xattr -d com.apple.quarantine techno-watch-bot-macos-arm64` (the file is not signed),
              then `./techno-watch-bot-macos-arm64`
            - **Windows:** run the `.exe`; if SmartScreen warns, choose "More info" then "Run anyway".

            ## Requirements

            - [Claude Code](https://code.claude.com) installed and logged in (`claude` works in your terminal).
            - Your own [google-tasks-mcp](https://github.com/mathisschmidt/google-tasks-mcp) server:
              set its URL in Settings, then choose "Connect Google Tasks" on the Home screen.

            Try the interface without Claude or Google: add `--fake`.
